site_name: rl-sandbox
site_description: A toolbox for training, evaluating, and comparing reinforcement learning algorithms
site_url: https://ashwin133.github.io/rl-sandbox/
repo_url: https://github.com/ashwin133/rl-sandbox
repo_name: ashwin133/rl-sandbox
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - API Reference:
      - CLI: api/cli.md
      - Environments: api/envs.md
      - Episodes: api/episode.md
      - File Operations: api/file_ops.md
      - Logging: api/logging_config.md
      - Models: api/models.md
      - Plotting: api/plot.md
      - Policies: api/policy.md
      - Rendering: api/render.md
      - Replay: api/replay.md
      - Training: api/training.md
      - Utilities: api/utilities.md
      - Viewer: api/viewer.md
